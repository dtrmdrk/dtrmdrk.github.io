<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body{% if page.reader %} class="reader-mode"{% endif %}>
  <nav class="sidebar">
    <a href="{{ '/' | relative_url }}">首页</a>
    <a href="{{ '/archive/' | relative_url }}">索引</a>
    <a href="{{ '/article/' | relative_url }}">文章</a>
    <a href="{{ '/gallery/' | relative_url }}">图集</a>
    <a href="{{ '/about/' | relative_url }}">关于</a>
    <button id="theme-toggle">🌙</button>
  </nav>

  <main class="container">
    {{ content }}
  </main>


   <aside class="player" id="player">
    <div class="player-head">
      <p class="player-title">♪ 播放器</p>
      <button id="fold-btn" title="折叠 / 展开">—</button>
    </div>
    <div class="player-body">
      <audio id="bgm" src="{{ '/assets/music/01.mp3' | relative_url }}"></audio>
      <div class="player-bar">
        <button id="play-btn">▶</button>
        <span id="track-name">Track 01</span>
      </div>
      <input type="range" id="seek" min="0" max="100" value="0">
    </div>
  </aside>
  
  <script>

    const audio = document.getElementById('bgm');
    const playBtn = document.getElementById('play-btn');
    if (audio && playBtn) {
      const seek = document.getElementById('seek');
      playBtn.addEventListener('click', () => {
        if (audio.paused) { audio.play(); playBtn.textContent = '❚❚'; }
        else { audio.pause(); playBtn.textContent = '▶'; }
      });
      audio.addEventListener('timeupdate', () => {
        if (audio.duration) seek.value = (audio.currentTime / audio.duration) * 100;
      });
      seek.addEventListener('input', () => {
        audio.currentTime = (seek.value / 100) * audio.duration;
      });
      audio.addEventListener('ended', () => { playBtn.textContent = '▶'; });
            
      const player = document.getElementById('player');
      const foldBtn = document.getElementById('fold-btn');
      if (player && foldBtn) {
        if (localStorage.getItem('player-folded') === '1') {
          player.classList.add('collapsed');
          foldBtn.textContent = '♪';
        }
        foldBtn.addEventListener('click', () => {
          const folded = player.classList.toggle('collapsed');
          foldBtn.textContent = folded ? '♪' : '—';
          localStorage.setItem('player-folded', folded ? '1' : '0');
        });
      }
    }

    
    const btn = document.getElementById('theme-toggle');
    const themes = ['light', 'dark', 'sepia'];
    const icons = { light: '🌙', dark: '☀️', sepia: '📜' };

    let currentTheme = localStorage.getItem('theme');

    function applyTheme(name) {
      document.body.classList.remove(...themes);
      if (name !== 'light') document.body.classList.add(name);
      btn.textContent = icons[name];
    }

    function themeByTime() {
      const h = new Date().getHours();
      return (h >= 19 || h < 7) ? 'dark' : 'light';
    }

    if (currentTheme === null) {
      currentTheme = themeByTime();
    }
    applyTheme(currentTheme);

    btn.addEventListener('click', () => {
      currentTheme = themes[(themes.indexOf(currentTheme) + 1) % themes.length];
      applyTheme(currentTheme);
      localStorage.setItem('theme', currentTheme);
    });

   
    const titleEl = document.getElementById('clock-title');

    function tick() {
      const now = new Date();
      const time = now.toLocaleTimeString('zh-CN', { hour12: false });
      if (titleEl) {
        titleEl.textContent = time;
      }
      document.title = time;
      if (localStorage.getItem('theme') === null) {
        currentTheme = themeByTime();
        applyTheme(currentTheme);
      }
    }

    if (titleEl) {
      const firstVisit = !localStorage.getItem('visited');
      titleEl.textContent = firstVisit ? '{{ site.title1 }}' : '{{ site.title2 }}';
      localStorage.setItem('visited', '1');

      setTimeout(() => {
        titleEl.classList.add('fade-out');
        setTimeout(() => {
          tick();
          setInterval(tick, 1000);
          titleEl.classList.remove('fade-out');
        }, 800);
      }, 3000);
    } else {
      setInterval(tick, 1000);
    }
  </script>
</body>
</html>
