<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>
  <main class="container">
    <nav>
      <a href="{{ '/' | relative_url }}">首页</a>
      <a href="{{ '/archive/' | relative_url }}">索引</a>
      <a href="{{ '/text/' | relative_url }}">文字</a>
      <a href="{{ '/image/' | relative_url }}">图像</a>
      <a href="{{ '/about/' | relative_url }}">关于</a>
      <button id="theme-toggle">🌙</button>
    </nav>
    {{ content }}
  </main>

  <script>
    const btn = document.getElementById('theme-toggle');
    const themes = ['light', 'dark', 'sepia'];
    const icons = { light: '🌙', dark: '☀️', sepia: '📜' };

    let currentTheme = localStorage.getItem('theme');

    function applyTheme(name) {
      document.body.classList.remove(...themes);
      if (name !== 'light') document.body.classList.add(name);
      btn.textContent = icons[name];
    }

    function themeByTime() {
      const h = new Date().getHours();
      return (h >= 19 || h < 7) ? 'dark' : 'light';
    }

    if (currentTheme === null) {
      currentTheme = themeByTime();
    }
    applyTheme(currentTheme);

    
    btn.addEventListener('click', () => {
      currentTheme = themes[(themes.indexOf(currentTheme) + 1) % themes.length];
      applyTheme(currentTheme);
      localStorage.setItem('theme', currentTheme);
    });


 
const titleEl = document.getElementById('clock-title');

function tick() {
  const now = new Date();
  const time = now.toLocaleTimeString('zh-CN', { hour12: false });
  if (titleEl) {
    titleEl.textContent = time + " · {{ site.title }}";
  }
  document.title = time;

  if (localStorage.getItem('theme') === null) {
    currentTheme = themeByTime();
    applyTheme(currentTheme);
  }
}

if (titleEl) {
  requestAnimationFrame(() => titleEl.classList.add('visible'));

  setTimeout(() => {
    titleEl.classList.add('fade-out');
    setTimeout(() => {
      tick();                   
      setInterval(tick, 1000);   
      titleEl.classList.remove('fade-out');  
    }, 800);
  }, 3000);
} else {

  setInterval(tick, 1000);
}

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
