  <main class="container">
    <p><a class="back-btn" href="/gallery/">← 返回</a></p>
<div class="spread" id="spread"></div>

<div class="reader-bar">
  <button onclick="prev()">← 上一页</button>
  <span id="page-num"></span>
  <button onclick="next()">下一页 →</button>
</div>

<script>

const pages = [
  
  "/assets/manga/01.jpg",
  "/assets/manga/02.jpg",
  "/assets/manga/03.jpg",
  "/assets/manga/04.jpg",
  "/assets/manga/05.jpg",
  "/assets/manga/06.jpg",
  "/assets/manga/07.jpg",
  "/assets/manga/08.jpg",
  "/assets/manga/09.jpg",
  "/assets/manga/10.jpg",
  "/assets/manga/11.jpg",
  "/assets/manga/12.jpg",
  "/assets/manga/13.jpg",
  "/assets/manga/14.jpg",
  "/assets/manga/15.jpg",
  
];

const spreadEl = document.getElementById('spread');
const numEl = document.getElementById('page-num');
const isMobile = window.matchMedia('(max-width: 700px)').matches;

let step = 0;
let single = 0;

function stepTotal() { return 1 + Math.floor((pages.length - 1) / 2); }

function render() {
  let html = '';
  if (isMobile) {
    html = `<img src="${pages[single]}">`;
    numEl.textContent = `${single + 1} / ${pages.length}`;
  } else if (step === 0) {
    html = `<img src="${pages[0]}">`;
    numEl.textContent = `1 / ${pages.length}`;
  } else {
    const right = 2 * step - 1;
    const left = 2 * step;
    html = `<img src="${pages[right]}">`;
    if (left < pages.length) {
      html = `<img src="${pages[left]}">` + html;
    }
    numEl.textContent = `${right + 1}~${Math.min(left + 1, pages.length)} / ${pages.length}`;
  }
  spreadEl.innerHTML = html;

  const nextIdx = isMobile ? single + 1 : 2 * step + 1;
  if (nextIdx < pages.length) new Image().src = pages[nextIdx];
}

function next() {
  if (isMobile) { if (single < pages.length - 1) single++; }
  else if (step < stepTotal() - 1) step++;
  render();
}
function prev() {
  if (isMobile) { if (single > 0) single--; }
  else if (step > 0) step--;
  render();
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
});

spreadEl.addEventListener('click', e => {
  const x = e.clientX / window.innerWidth;
  if (x > 0.5) next(); else prev();
});

render();
</script>

        <span id="track-time">0:00 / 0:00</span>
      </div>
      <div class="player-controls">
        <div class="transport">
          <button id="prev-btn" title="上一首"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM18 6l-8.5 6 8.5 6z"/></svg></button>
          <button id="play-btn" title="播放/暂停"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
          <button id="next-btn" title="下一首"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg></button>
        </div>
        <div class="vol-group">
          <input type="range" id="volume" min="0" max="1" step="0.05" value="1">
          <button id="vol-btn" title="音量"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        </div>
      </div>
    </div>
   </aside>
