  <main class="container">
    <p><input type="text" id="search" placeholder="请输入标题或标签" autocomplete="off" /></p>

<div class="tag-cloud">

  <span class="tag tag-link" onclick="searchTag('notice')">notice</span>

  <span class="tag tag-link" onclick="searchTag('game')">game</span>

  <span class="tag tag-link" onclick="searchTag('music?')">music?</span>

</div>

<div id="results"></div>

<script>

const posts = [
  
  {
    title: "Olive Lover???",
    url: "/article/2026/11/20/olive-lover.html",
    date: "2026-11-20",
    categories: ["article"],
    tags: ["music?"],
    excerpt: "上周末去外地小酒吧尝到了惊为天人的腌渍橄榄后我便陷入了单相思之苦，从来没吃过这么好吃的橄榄！不如说我从来没觉得橄榄好吃过！原来，竟然，可以，这么，好吃。此..."
  },
  
  {
    title: "博客装修2",
    url: "/2026/11/20/blog-updates2.html",
    date: "2026-11-20",
    categories: [],
    tags: ["notice"],
    excerpt: "音乐播放器\n"
  },
  
  {
    title: "杂谈",
    url: "/article/2026/11/12/random-talk.html",
    date: "2026-11-12",
    categories: ["article"],
    tags: ["music","game"],
    excerpt: "耗时一周完成了第一首练习曲。\n"
  },
  
  {
    title: "音乐制作软件",
    url: "/article/2026/11/11/music-production.html",
    date: "2026-11-11",
    categories: ["article"],
    tags: ["music"],
    excerpt: "\n  及插件试用情况记录\n\n"
  },
  
  {
    title: "添加了音乐",
    url: "/2026/11/09/music-added.html",
    date: "2026-11-09",
    categories: [],
    tags: ["notice"],
    excerpt: "如题。\n"
  },
  
  {
    title: "漫画试阅",
    url: "/gallery/2026/10/29/manga-launch.html",
    date: "2026-10-29",
    categories: ["gallery"],
    tags: ["comic"],
    excerpt: "→ 点这里开始阅读\n"
  },
  
  {
    title: "博客装修",
    url: "/2026/10/28/blog-updates.html",
    date: "2026-10-28",
    categories: [],
    tags: ["notice"],
    excerpt: "Added\n"
  },
  
  {
    title: "测试",
    url: "/2026/10/27/test.html",
    date: "2026-10-27",
    categories: [],
    tags: [],
    excerpt: "test\n"
  },
  
];

const input = document.getElementById('search');
const results = document.getElementById('results');

function render(list) {
  if (list.length === 0) {
    results.innerHTML = '<p style="color: var(--meta);">未找到相关记录。</p>';
    return;
  }
  results.innerHTML = '<ul class="post-list">' + list.map(p => `
    <li>
      <span class="date">${p.date}</span>
      <a href="${p.url}">${p.title}</a>
      <span class="tags">${p.tags.map(t => `<span class="tag tag-link" onclick="searchTag('${t}')">${t}</span>`).join('')}</span>
    </li>`).join('') + '</ul>';
}
  
function search() {
  const q = input.value.trim().toLowerCase();
  render(posts.filter(p =>
    p.title.toLowerCase().includes(q) ||
    p.categories.join(' ').toLowerCase().includes(q) ||
    p.tags.join(' ').toLowerCase().includes(q) ||
    p.excerpt.toLowerCase().includes(q)
  ));
}

function searchTag(t) { input.value = t; search(); input.focus(); }
  
input.addEventListener('input', search);

const urlTag = new URLSearchParams(location.search).get('tag');
if (urlTag) searchTag(urlTag);
</script>

        </div>
        <div class="vol-group">
          <input type="range" id="volume" min="0" max="1" step="0.05" value="1">
          <button id="vol-btn" title="音量"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        </div>
      </div>
    </div>
   </aside>
